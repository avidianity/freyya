[workspace]
resolver = "3"
members = ["crates/freyya", "crates/freyya-core", "crates/freyya-cli", "xtask"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.jomini]
opt-level = 3

[workspace.lints.rust]
warnings = "deny"
dead_code = "deny"
unused = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
