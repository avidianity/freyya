name: policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  CARGO_PROFILE_DEV_DEBUG: "0"

concurrency:
  group: policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check out the protected base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request head as data only
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          fetched=$(git rev-parse refs/remotes/pr/head)
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "The fetched head $fetched is not the event head $HEAD_SHA; a newer push will rerun this check."
            exit 1
          fi
      - name: Install the base toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: linux-xtask-run
          cache-workspace-crates: true
          save-if: false
      - name: risk-tier and test-oracle-guard
        id: tier
        run: cargo xtask risk-tier --base "$BASE_SHA" --head refs/remotes/pr/head --github-output "$GITHUB_OUTPUT"
      - name: Apply the tier label
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          for n in 0 1 2 3 4; do
            if [ "$n" != "$TIER" ]; then
              gh pr edit "$PR_NUMBER" -R "$REPO" --remove-label "tier-$n" > /dev/null 2>&1 || true
            fi
          done
          gh pr edit "$PR_NUMBER" -R "$REPO" --add-label "tier-$TIER"
      - name: Save the pull request body as data
        run: jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/body.md"
      - name: Find the ci run for the head commit
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=""
          for attempt in $(seq 1 12); do
            url=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" --jq '.workflow_runs[0].html_url // ""')
            if [ -n "$url" ]; then
              break
            fi
            sleep 10
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: evidence-bundle
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          CI_RUN_URL: ${{ steps.ci_run.outputs.url }}
        run: cargo xtask evidence-bundle --body-file "$RUNNER_TEMP/body.md" --head-sha "$HEAD_SHA" --tier "$TIER" --repo "$REPO" --ci-run-url "$CI_RUN_URL"
      - name: behavior-has-test
        run: cargo xtask behavior-has-test --base "$BASE_SHA" --head refs/remotes/pr/head --body-file "$RUNNER_TEMP/body.md"
